services:
  endurain:
    container_name: endurain-app
    image: ghcr.io/endurain-project/endurain:v0.20.2
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/logs:/app/backend/logs
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: endurain-postgres
    env_file:
      - .env
    volumes:
      - ./postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=endurain
      - POSTGRES_USER=endurain
      - POSTGRES_PASSWORD=19Endurain82!
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U endurain -d endurain"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped