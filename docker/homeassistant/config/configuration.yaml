template:
  - sensor:
      - name: "Boesch Status Text"
        unique_id: boesch_status_text
        state: >
          {% set status_map = {
            '0': 'Standby',
            '1': 'Alarm',
            '2': 'Warmwasser (TWE)',
            '3': 'Kühlen',
            '4': 'Heizen',
            '5': 'Abtauung',
            '6': 'Vorbereitung',
            '7': 'Blockiert',
            '8': 'EVU Sperre',
            '9': 'Nicht verfügbar'
          } %}
          {% set code = states('sensor.boesch_status_code') | string %}
          {{ status_map.get(code, 'Unbekannt (' ~ code ~ ')') }}

      - name: "Energy Total Consumption"
        unique_id: energy_total_consumption_wh
        unit_of_measurement: "Wh"
        device_class: energy
        state_class: total
        state: >
          {% set pv = states('sensor.technikraum_wechselrichter_pv_energy_total') | float(none) %}
          {% set imp = states('sensor.technikraum_fronius_smartmeter_real_energy_consumed') | float(none) %}
          {% set exp = states('sensor.technikraum_fronius_smartmeter_real_energy_produced') | float(none) %}
          {% set bat = states('sensor.julia_walland_battery_discharging_energy_total') | float(none) %}
          {% if pv is none or imp is none or exp is none or bat is none %}
            {{ this.state if this.state not in ['unknown', 'unavailable', none] else 0 }}
          {% else %}
            {% set total = pv + imp - exp + bat %}
            {{ [0, total] | max | round(0) | int }}
          {% endif %}

      - name: "Energy Self Consumption"
        unique_id: energy_self_consumption_wh
        unit_of_measurement: "Wh"
        device_class: energy
        state_class: total
        state: >
          {% set pv = states('sensor.technikraum_wechselrichter_pv_energy_total') | float(none) %}
          {% set exp = states('sensor.technikraum_fronius_smartmeter_real_energy_produced') | float(none) %}
          {% if pv is none or exp is none %}
            {{ this.state if this.state not in ['unknown', 'unavailable', none] else 0 }}
          {% else %}
            {% set self_cons = pv - exp %}
            {{ [0, self_cons] | max | round(0) | int }}
          {% endif %}

      - name: "Energy Boesch Heat Pump Loss"
        unique_id: energy_boesch_heat_pump_loss_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        state: >
          {% set tot = states('sensor.energy_boesch_heat_pump_total') | float(none) %}
          {% set htg = states('sensor.energy_boesch_heat_pump_heating') | float(none) %}
          {% set twe = states('sensor.energy_boesch_heat_pump_water') | float(none) %}
          {% if tot is none or htg is none or twe is none %}
            {{ this.state if this.state not in ['unknown', 'unavailable', none] else 0 }}
          {% else %}
            {% set diff = tot - htg - twe %}
            {{ [0, diff] | max | round(3) }}
          {% endif %}

      - name: "Power Household"
        unique_id: power_household_w
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set load_w = states('sensor.solarnet_power_load_consumed') | float(none) %}
          {% set hp_kw = states('sensor.boesch_aktuelle_elektrische_leistung_gesamt') | float(none) %}
          {% if load_w is none or hp_kw is none %}
            {{ this.state if this.state not in ['unknown', 'unavailable', none] else 0 }}
          {% else %}
            {% set hp_w = hp_kw * 1000 %}
            {{ [0, load_w - hp_w] | max | round(0) | int }}
          {% endif %}


      - name: "Power Self Consumption"
        unique_id: power_self_consumption_w
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set pv_entity = 'sensor.technikraum_wechselrichter_pv_power' %}
          {% set exp_entity = 'sensor.technikraum_fronius_smartmeter_real_power_produced' %}
          {% set pv_raw = states(pv_entity) | float(none) %}
          {% set exp_raw = states(exp_entity) | float(none) %}
          {% if pv_raw is none or exp_raw is none %}
            {{ this.state if this.state not in ['unknown', 'unavailable', none] else 0 }}
          {% else %}
            {% set pv_w = pv_raw * 1000 if state_attr(pv_entity, 'unit_of_measurement') == 'kW' else pv_raw %}
            {% set exp_w = exp_raw * 1000 if state_attr(exp_entity, 'unit_of_measurement') == 'kW' else exp_raw %}
            {% set self_cons_w = pv_w - [0, exp_w] | max %}
            {{ [0, self_cons_w] | max | round(0) | int }}
          {% endif %}

sensor:
  - platform: integration
    source: sensor.boesch_aktuelle_elektrische_leistung_gesamt
    name: "Energy Boesch Heat Pump Total"
    unique_id: energy_boesch_heat_pump_total_kwh
