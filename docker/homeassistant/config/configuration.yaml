# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# automation: !include automations.yaml
# script: !include scripts.yaml
# scene: !include scenes.yaml

influxdb:
  host: influxdb
  port: 8086
  database: homeassistant
  username: thomas
  password: homeassistant1234!
  max_retries: 3
  default_measurement: state
  exclude:
    domains:
      - person
      - automation
      - binary_sensor
  include:
    entity_globs:
      - sensor.energy_*
      - sensor.heat_*
      - sensor.julia_walland_*
      - sensor.solarnet_*
      - sensor.technikraum_*
      - sensor.boesch_*
      - sensor.power_*

