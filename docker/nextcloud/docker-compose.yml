services:
  db:
    image: mariadb:11.4
    container_name: nextcloud-db
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-nextcloud}
      MARIADB_USER: ${MARIADB_USER:-nextcloud}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - ./db:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped

  app:
    image: nextcloud:31-apache
    container_name: nextcloud
    ports:
      - "8081:80"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MARIADB_DATABASE:-nextcloud}
      MYSQL_USER: ${MARIADB_USER:-nextcloud}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
      NEXTCLOUD_DATA_DIR: /mnt/documents/
    volumes:
      - ./nextcloud:/var/www/html
      - "/Volumes/Backup 1/Nextcloud Data:/mnt/documents"
    depends_on:
      - db
      - redis
    restart: unless-stopped
